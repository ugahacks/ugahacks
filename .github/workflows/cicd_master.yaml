name: Deploy production

on:
  push:
    branches:
      - master
    paths:
      - "web/**"
      - ".github/deploy-projects.json"
      - ".github/scripts/project-matrix.sh"
      - ".github/workflows/cicd_master.yaml"

permissions:
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: matrix
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: echo "matrix=$(bash .github/scripts/project-matrix.sh "$BASE" "$HEAD" production)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: Deploy ${{ matrix.id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Select image
        id: image
        env:
          GCP_PROJECT: ${{ env.PROJECT_ID }}
          PROJECT: ${{ matrix.id }}
          REGISTRY: ${{ matrix.registry }}
          REVISION: ${{ github.sha }}
        run: |
          if [[ "$REGISTRY" == "artifact" ]]; then
            image="us-east1-docker.pkg.dev/$GCP_PROJECT/ugahacks/$PROJECT:$REVISION"
          else
            image="gcr.io/$GCP_PROJECT/$PROJECT-prod:$REVISION"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Authorize Docker push
        env:
          REGISTRY: ${{ matrix.registry }}
        run: |
          if [[ "$REGISTRY" == "artifact" ]]; then
            gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          else
            gcloud auth configure-docker --quiet
          fi

      - name: Build and push container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker build --tag "$IMAGE" "${{ matrix.path }}"
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.id }}-prod
          image: ${{ steps.image.outputs.image }}
          region: ${{ matrix.region }}

      - name: Report deployment URL
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: echo "$URL"
