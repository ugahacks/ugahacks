name: Deploy production

on:
  push:
    branches:
      - master
    paths:
      - "web/**"
      - ".github/deploy_matrix.json"
      - ".github/workflows/cicd_master.yaml"

permissions:
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect changed files
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Files touched by this push (one path per line).
          git diff --name-only "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files.txt"

      - name: Determine deployment scope
        id: scope
        run: |
          # A change to the workflow or the project registry can affect every
          # project, so redeploy all of them rather than trying to diff intent.
          if grep -qE '^\.github/(deploy_matrix\.json|workflows/cicd_master\.yaml)$' "$RUNNER_TEMP/changed-files.txt"; then
            echo "force_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deployment matrix
        id: matrix
        env:
          FORCE_ALL: ${{ steps.scope.outputs.force_all }}
        run: |
          # Build the deploy matrix: keep each production project whose directory
          # contains a changed file (or keep all of them when force_all is set).
          matrix=$(jq -c \
            --rawfile changed "$RUNNER_TEMP/changed-files.txt" \
            --argjson force_all "$FORCE_ALL" \
            '{
              include: [
                .include[]
                | select(.production)
                | . as $project
                | select(
                    $force_all or
                    ($changed | split("\n") | any(startswith($project.path + "/")))
                  )
              ]
            }' .github/deploy_matrix.json)

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: Deploy ${{ matrix.id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Select image
        id: image
        env:
          GCP_PROJECT: ${{ env.PROJECT_ID }}
          PROJECT: ${{ matrix.id }}
          REGISTRY: ${{ matrix.registry }}
          REVISION: ${{ github.sha }}
        run: |
          if [[ "$REGISTRY" == "artifact" ]]; then
            image="us-east1-docker.pkg.dev/$GCP_PROJECT/ugahacks/$PROJECT:$REVISION"
          else
            image="gcr.io/$GCP_PROJECT/$PROJECT-prod:$REVISION"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Authorize Docker push
        env:
          REGISTRY: ${{ matrix.registry }}
        run: |
          if [[ "$REGISTRY" == "artifact" ]]; then
            gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          else
            gcloud auth configure-docker --quiet
          fi

      - name: Build container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker build --tag "$IMAGE" "${{ matrix.path }}"

      - name: Push container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.id }}-prod
          image: ${{ steps.image.outputs.image }}
          region: ${{ matrix.region }}

      - name: Report deployment URL
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: echo "$URL"
