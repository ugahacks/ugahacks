name: Test

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/deploy_matrix.json"
      - ".github/workflows/cicd_master.yaml"
      - ".github/workflows/cicd_pr.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build validation matrix
        id: matrix
        env:
          BASE: ${{ github.event.pull_request.base.sha || format('{0}^', github.sha) }}
          HEAD: ${{ github.sha }}
        run: |
          # Files touched by this PR (one path per line).
          changed=$(git diff --name-only "$BASE" "$HEAD")

          # A change to the workflows or the deploy matrix can affect every
          # project, so validate all of them rather than trying to diff intent.
          if grep -qE '^\.github/(deploy_matrix\.json|workflows/(cicd_master|cicd_pr)\.yaml)$' <<< "$changed"; then
            force_all=true
          else
            force_all=false
          fi

          # Build the validation matrix from the same file the deploy workflow
          # deploys from: keep each project whose directory contains a changed
          # file (or keep all of them when force_all is set).
          matrix=$(jq -c \
            --arg changed "$changed" \
            --argjson force_all "$force_all" \
            '{
              include: [
                .include[]
                | . as $project
                | select(
                    $force_all or
                    ($changed | split("\n") | any(startswith($project.path + "/")))
                  )
              ]
            }' .github/deploy_matrix.json)

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: Validate ${{ matrix.id }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - name: Install dependencies
        run: |
          if grep -q '"packageManager": "yarn@1' package.json; then
            yarn install --frozen-lockfile
          else
            yarn install --immutable
          fi
      - run: yarn lint
      - run: yarn build
      - name: Build container
        run: docker build .
