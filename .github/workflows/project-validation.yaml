name: Project matrix validation

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/deploy-projects.json"
      - ".github/scripts/project-matrix.mjs"
      - ".github/workflows/project-validation.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: matrix
        env:
          BASE: ${{ github.event.pull_request.base.sha || format('{0}^', github.sha) }}
          HEAD: ${{ github.sha }}
        run: echo "matrix=$(node .github/scripts/project-matrix.mjs "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: Validate ${{ matrix.id }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: ${{ matrix.path }}/yarn.lock
      - run: corepack enable
      - name: Install dependencies
        run: |
          if grep -q '"packageManager": "yarn@1' package.json; then
            yarn install --frozen-lockfile
          else
            yarn install --immutable
          fi
      - run: yarn lint
      - run: yarn build
      - if: matrix.docker
        run: docker build .
