name: Project matrix validation

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/deploy-projects.json"
      - ".github/project-paths.yaml"
      - ".github/workflows/cicd_master.yaml"
      - ".github/workflows/project-validation.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/project-paths.yaml
      - id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if jq -e 'index("all")' <<< "$CHANGED" >/dev/null; then
            result=$(jq -c '{include: .}' .github/deploy-projects.json)
          else
            result=$(jq -c --argjson changed "$CHANGED" \
              '{include: [.[] | select(.id as $id | $changed | index($id))]}' \
              .github/deploy-projects.json)
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
        shell: bash

  validate:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: Validate ${{ matrix.id }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - name: Install dependencies
        run: |
          if grep -q '"packageManager": "yarn@1' package.json; then
            yarn install --frozen-lockfile
          else
            yarn install --immutable
          fi
      - run: yarn lint
      - run: yarn build
      - if: matrix.docker
        run: docker build .
