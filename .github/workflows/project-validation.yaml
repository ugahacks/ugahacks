name: Project matrix validation

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/deploy-projects.json"
      - ".github/workflows/cicd_master.yaml"
      - ".github/workflows/project-validation.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: matrix
        env:
          BASE: ${{ github.event.pull_request.base.sha || format('{0}^', github.sha) }}
          HEAD: ${{ github.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD" | jq -Rsc 'split("\n") | map(select(length > 0))')
          force_all=$(jq -nr --argjson changed "$changed" '
            $changed | any(
              . == ".github/deploy-projects.json" or
              . == ".github/workflows/cicd_master.yaml" or
              . == ".github/workflows/project-validation.yaml"
            )
          ')
          matrix=$(jq -c \
            --argjson changed "$changed" \
            --argjson force_all "$force_all" '
              {include: [
                .[]
                | select(
                    $force_all or
                    (.path as $path | $changed | any(startswith($path + "/")))
                  )
              ]}
            ' .github/deploy-projects.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: Validate ${{ matrix.id }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - name: Install dependencies
        run: |
          if grep -q '"packageManager": "yarn@1' package.json; then
            yarn install --frozen-lockfile
          else
            yarn install --immutable
          fi
      - run: yarn lint
      - run: yarn build
      - if: matrix.docker
        run: docker build .
