nodeLinker: node-modules

# The repo root pins Yarn 4.3.0, which predates catalogs and errors out on the
# `catalog` setting below. Pin this project to its own release so the root and
# the older sites keep running 4.3.0 untouched.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# Shared version pins for the stack every new site is built on. Dependencies
# below are referenced from package.json as `"next": "catalog:"` rather than a
# literal range, so a bump here is the single place a version changes.
#
# Yarn merges .yarnrc.yml files up the directory tree, so once every project in
# the repo is on Yarn >= 4.10 this block can move verbatim to the repo root and
# be shared by all of them. Until then it lives here, because Yarn 4.3.0 treats
# an unknown `catalog` key as a fatal config error.
catalog:
  "@radix-ui/react-accordion": ^1.2.20
  "@tailwindcss/postcss": ^4.3.3
  "@types/node": ^20.19.43
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  babel-plugin-react-compiler: 1.0.0
  eslint: ^9.39.5
  eslint-config-next: 16.2.10
  next: 16.2.10
  prettier: ^3.9.5
  prettier-plugin-tailwindcss: ^0.8.1
  react: 19.2.4
  react-dom: 19.2.4
  react-icons: ^5.7.0
  tailwindcss: ^4.3.3
  tailwindcss-palette-generator: ^2.4.0
  typescript: ^5.9.3
